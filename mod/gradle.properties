# Gradle — düşük RAM'li makinelerde (≈4-6 GB) taşmayı önlemek için ölçülü tutuldu.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false

# Mod metadata
mod_version=1.0.0
maven_group=dev.alpinoxi
archives_base_name=alpinoxi-client

# Fabric loader (tüm MC sürümleriyle uyumlu en güncel sürüm):
# https://meta.fabricmc.net/v2/versions/loader
loader_version=0.20.1

# NOT: Hedef Minecraft sürümü build sırasında seçilir (bkz. build.gradle):
#   ./gradlew build                -> 1.20.1 (varsayılan)
#   ./gradlew build -Pmc=1.21.1    -> 1.21.1
# Yarn mappings ve Fabric API sürümleri build.gradle içindeki tablodan gelir.
